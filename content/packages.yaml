- kicker: "Fixed price · 2 weeks"
  name: "Architecture Sprint"
  price: "₹999"
  terms: "one-off · architecture review and a build plan you keep"
  blurb: >-
    For teams with an agentic idea and no agreed shape. Ends with a build plan
    detailed enough to staff and estimate.
  items:
    - "Discovery with your engineers and domain experts"
    - "Target architecture, tool contracts and failure model"
    - "Evaluation approach and cost ceiling"
    - "A costed, sequenced build plan you keep"
  cta: "Scope a sprint"

- kicker: "Hands-on · build session"
  name: "Build and Ship"
  price: "₹899"
  terms: "one-off · a hands-on build session in your repos"
  blurb: >-
    I build the thing. Hands on keyboard in your repos, working with your team,
    shipping to your infrastructure.
  items:
    - "Architecture plus implementation, not handoff"
    - "CI, observability and runbooks as part of delivery"
    - "A working demo and written status"
    - "Pair sessions so the knowledge stays with your team"
  cta: "Check availability"

- kicker: "Advisory · call"
  name: "Fractional Architect"
  price: "₹799"
  terms: "one-off · an advisory call on the decisions that matter"
  blurb: >-
    Architectural cover for a team that has engineers but no one senior enough
    to own the system-level decisions.
  items:
    - "Design and code review on the decisions that matter"
    - "Escalation support for architecture questions"
    - "Hiring input: loops, rubrics, technical interviews"
    - "An architecture health review"
  cta: "Talk it through"

- kicker: "Session · 60 minutes"
  name: "Interview Prep"
  price: "₹599"
  terms: "one-off · 60-minute video call"
  blurb: >-
    A focused session before a system-design or backend loop — what panels
    probe for, where candidates lose signal, and how to structure an answer
    under time.
  items:
    - "A mock round on a real system-design or backend prompt"
    - "Live feedback on structure, trade-offs and communication"
    - "A written scorecard with the gaps to close"
    - "Follow-up notes and reading for your target level"
  cta: "Book a session"

- kicker: "Call · 30 minutes"
  name: "30-Minute Discussion"
  price: "₹299"
  terms: "one-off · 30 minutes, one topic, no deck"
  blurb: >-
    A short call to talk through one problem — an architecture decision, a
    career question, or whether a longer engagement makes sense.
  items:
    - "One topic, thirty minutes, no deck"
    - "A direct opinion and the reasoning behind it"
    - "Pointers to what I would read or do next"
  cta: "Book a call"
