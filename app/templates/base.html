<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Puneet Behl — Solutions Architect{% endblock %}</title>
<meta name="description" content="{% block description %}Freelance solutions architect. Distributed systems, AWS and Kubernetes, agentic AI.{% endblock %}">
<link rel="canonical" href="{{ request.url.scheme }}://{{ request.url.netloc }}{{ request.url.path }}">
<meta property="og:title" content="{{ self.title() }}">
<meta property="og:description" content="{{ self.description() }}">
<meta property="og:type" content="{% block og_type %}website{% endblock %}">
<link rel="icon" href="/static/favicon.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap">
<link rel="stylesheet" href="/static/css/styles.css">
<link rel="stylesheet" href="/static/css/site.css">
</head>
<body>
{% include "_plates.svg" %}
<div style="max-width:1120px;margin:0 auto;padding:0 clamp(16px,3vw,24px) 0">
<div id="progress"></div>
{% include "_header.html" %}
{% block main %}{% endblock %}
{% include "_footer.html" %}
</div>
<script src="/static/js/site.js" defer></script>
</body>
</html>
