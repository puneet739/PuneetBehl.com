<header style="position:sticky;top:0;z-index:20;background:var(--color-bg);padding-top:14px">
  <div style="border-top:4px solid var(--color-text);border-bottom:1px solid var(--color-text);display:flex;align-items:baseline;justify-content:space-between;gap:20px;padding:10px 0 8px">
    <a href="/" style="font:600 22px/1 var(--font-heading);color:var(--color-text);letter-spacing:.01em">PUNEET BEHL</a>
    <div style="display:flex;gap:16px;align-items:baseline;font-size:11.5px;color:var(--color-neutral-700)">
      <span>{{ site.tagline_role }}</span>
      <span style="color:var(--color-accent-700)">{{ now_dateline() }}</span>
    </div>
  </div>
  <nav style="display:flex;flex-wrap:wrap;align-items:center;gap:22px;padding:9px 0;border-bottom:1px solid var(--color-divider)">
    <a href="/work" class="und" style="font-size:14px;color:{% if nav_active == 'work' %}var(--color-accent){% else %}var(--color-text){% endif %}">Work</a>
    <a href="/agentic" class="und" style="font-size:14px;color:{% if nav_active == 'agentic' %}var(--color-accent){% else %}var(--color-text){% endif %}">Agentic AI</a>
    <a href="/services" class="und" style="font-size:14px;color:{% if nav_active == 'services' %}var(--color-accent){% else %}var(--color-text){% endif %}">Services</a>
    <a href="/about" class="und" style="font-size:14px;color:{% if nav_active == 'about' %}var(--color-accent){% else %}var(--color-text){% endif %}">About</a>
    <a href="/interviews" class="und" style="font-size:14px;color:{% if nav_active == 'interviews' %}var(--color-accent){% else %}var(--color-text){% endif %}">Mock interviews</a>
    <a href="/writing" class="und" style="font-size:14px;color:{% if nav_active == 'writing' %}var(--color-accent){% else %}var(--color-text){% endif %}">Writing</a>
    <a href="/contact" class="und" style="font-size:14px;color:{% if nav_active == 'contact' %}var(--color-accent){% else %}var(--color-text){% endif %}">Contact</a>
    <span style="margin-left:auto;display:flex;align-items:center;gap:12px">
      <span style="display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--color-neutral-700)"><span style="width:7px;height:7px;border-radius:50%;background:var(--color-accent-2)"></span>{{ site.availability_short }}</span>
      <a href="/contact" class="btn btn-primary" style="font-size:13px;padding:7px 14px">Book a call</a>
    </span>
  </nav>
</header>
