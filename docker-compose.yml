services:
  web:
    build:
      context: .
      target: runtime
    image: puneetbehl-site:local
    ports:
      # Host port is overridable: HOST_PORT=9000 docker compose up
      - "${HOST_PORT:-8000}:8000"
    env_file:
      # Optional so `docker compose up` works before you `cp .env.example .env`.
      - path: .env
        required: false
    environment:
      # Container always listens on 8000; map it above to change the host port.
      PORT: "8000"
    volumes:
      # Dev convenience: edit content/ without rebuilding the image.
      # Content is cached at startup, so restart the service to pick edits up.
      # Remove this mount for production deployments.
      - ./content:/app/content:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2).status == 200 else 1)"
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: unless-stopped
